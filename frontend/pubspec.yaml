name: saathi_ai
description: Personal AI Operating System
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  riverpod: ^2.5.0
  flutter_riverpod: ^2.5.0

  # HTTP Client
  dio: ^5.4.0

  # Storage
  shared_preferences: ^2.2.0

  # UI
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.0

  # Utilities
  get_it: ^7.6.0
  logger: ^2.1.0
  intl: ^0.19.0

   # Audio recording
  record: ^5.0.0
  path_provider: ^2.1.3
  # Audio playback
  just_audio: ^0.9.0
  
  # Permissions
  permission_handler: ^11.4.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  mockito: ^5.4.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true